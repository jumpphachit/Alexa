<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel World 🌍</title>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--green:#4ecca3;--yellow:#ffd460;--blue:#38bdf8;--purple:#a78bfa;--text:#eaeaea;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.screen{display:none;width:100%;max-width:500px;padding:28px 16px;flex-direction:column;align-items:center;gap:14px;}
.screen.active{display:flex;}
h1{font-size:2rem;letter-spacing:6px;color:var(--green);text-shadow:0 0 20px rgba(78,204,163,0.4);}
.sub{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
.card{width:100%;background:var(--surface);border:1px solid #2a2a4a;border-radius:14px;padding:20px;}
.card h2{font-size:11px;letter-spacing:3px;color:var(--green);margin-bottom:14px;text-transform:uppercase;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.field input{background:var(--bg);border:1px solid #2a2a4a;border-radius:8px;padding:10px 13px;color:var(--text);font-family:'Courier New',monospace;font-size:13px;outline:none;}
.field input:focus{border-color:var(--green);}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-green{background:var(--green);color:var(--bg);font-weight:bold;}
.btn-red{background:var(--accent);color:#fff;font-weight:bold;}
.av-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
.av-opt{aspect-ratio:1;border:2px solid #2a2a4a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;background:var(--bg);}
.av-opt.sel{border-color:var(--green);background:rgba(78,204,163,0.15);}
.col-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.col-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.col-dot.sel{border-color:#fff;transform:scale(1.2);}
.err{font-size:11px;color:var(--accent);min-height:16px;letter-spacing:1px;}
#gameScreen{max-width:100%;padding:0;}
#hdr{width:100%;background:var(--surface);border-bottom:1px solid #2a2a4a;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.hl{display:flex;gap:10px;align-items:center;}
.hmap{font-size:10px;letter-spacing:2px;color:var(--yellow);text-transform:uppercase;}
.hcoin{font-size:11px;color:var(--yellow);}
.hlvl{font-size:11px;color:var(--purple);}
#onl{font-size:11px;color:var(--green);}
.hr{display:flex;gap:7px;align-items:center;}
.bsm{padding:5px 11px;border:none;border-radius:6px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;}
.bsm.red{background:var(--accent);color:#fff;}
.bsm.bl{background:var(--blue);color:var(--bg);font-weight:bold;}
.bsm.yl{background:var(--yellow);color:var(--bg);font-weight:bold;}
#worldCanvas{display:block;width:100%;max-width:700px;image-rendering:pixelated;cursor:none;}
#bottomUI{width:100%;max-width:700px;background:var(--surface);border-top:1px solid #2a2a4a;}
#qbar{padding:8px 14px;border-bottom:1px solid #1a1a3a;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.qlbl{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
#qtext{font-size:11px;color:var(--yellow);flex:1;}
#qprog{font-size:11px;color:var(--green);white-space:nowrap;}
#scoreboard{padding:6px 14px;border-bottom:1px solid #1a1a3a;display:flex;gap:14px;overflow-x:auto;min-height:28px;}
.sbi{font-size:10px;color:var(--muted);white-space:nowrap;}
.sbi span{color:var(--text);}
#ctrl{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.chint{font-size:10px;color:var(--muted);}
.chint kbd{background:var(--bg);border:1px solid #3a3a5a;border-radius:3px;padding:1px 5px;font-size:10px;color:var(--text);}
#dpad{display:none;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:3px;}
.db{background:var(--card);border:1px solid #2a4a6a;border-radius:7px;color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent;}
.db:active{background:var(--green);color:var(--bg);}
@media(max-width:600px){#dpad{display:grid;}.chint{display:none;}}
#chatW{border-top:1px solid #1a1a3a;padding:8px 14px;display:flex;gap:7px;}
#chatI{flex:1;background:var(--bg);border:1px solid #2a2a4a;border-radius:6px;padding:7px 11px;color:var(--text);font-family:'Courier New',monospace;font-size:11px;outline:none;}
#chatI:focus{border-color:var(--green);}
#chatB{background:var(--green);color:var(--bg);border:none;border-radius:6px;padding:7px 12px;font-family:'Courier New',monospace;font-size:10px;font-weight:bold;cursor:pointer;}
.mo{position:fixed;inset:0;background:rgba(10,10,20,.88);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.mo.hide{display:none;}
.mb{background:var(--surface);border:1px solid #3a3a5a;border-radius:16px;padding:22px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
.mb h2{font-size:13px;letter-spacing:3px;color:var(--green);margin-bottom:14px;text-transform:uppercase;}
.mb p{font-size:12px;color:var(--text);line-height:1.7;margin-bottom:12px;}
.mbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.mbtns .btn{font-size:11px;padding:10px;}
.mgrd{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.mc{background:var(--bg);border:2px solid #2a2a4a;border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;text-align:center;}
.mc:hover,.mc.cur{border-color:var(--green);background:rgba(78,204,163,.08);}
.mc.lk{opacity:.4;cursor:not-allowed;}
.mc .mi{font-size:2rem;margin-bottom:5px;}
.mc .mn{font-size:11px;letter-spacing:2px;color:var(--green);text-transform:uppercase;}
.mc .mr{font-size:9px;color:var(--muted);margin-top:3px;}
#tttgrd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.tcel{aspect-ratio:1;background:var(--bg);border:2px solid #3a3a5a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;}
.tcel:hover{border-color:var(--green);}
.tcel.x{color:var(--accent);}
.tcel.o{color:var(--blue);}
#popup{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(255,212,96,.95);color:#1a1a2e;border-radius:10px;padding:7px 18px;font-size:12px;font-weight:bold;letter-spacing:2px;z-index:300;transition:opacity .5s;pointer-events:none;}
#popup.hide{opacity:0;}
</style>
</head>
<body>

<div class="screen active" id="joinScreen">
  <h1>PIXEL WORLD</h1>
  <p class="sub">quest · collect · mini-games · multiplayer</p>
  <div class="card">
    <h2>Choose Character</h2>
    <div class="av-grid" id="avGrid"></div>
    <div class="col-row" id="colRow"></div>
    <div class="field"><label>Name</label><input id="nameI" placeholder="Your name..." maxlength="12"></div>
    <div class="field"><label>Room Code</label><input id="roomI" placeholder="e.g. friends2024" maxlength="20"></div>
    <div class="err" id="errMsg"></div>
    <button class="btn btn-green" onclick="joinGame()">Enter World ➜</button>
  </div>
</div>

<div class="screen" id="gameScreen">
  <div id="hdr">
    <div class="hl">
      <div class="hmap" id="hmap">🌿 Forest</div>
      <div class="hcoin" id="hcoin">🪙 0</div>
      <div class="hlvl" id="hlvl">⭐ Lv.1</div>
    </div>
    <div id="onl">● 1 online</div>
    <div class="hr">
      <button class="bsm yl" onclick="openMaps()">🗺 Maps</button>
      <button class="bsm bl" onclick="openMG()">🎮 Mini</button>
      <button class="bsm red" onclick="leaveGame()">Leave</button>
    </div>
  </div>
  <canvas id="worldCanvas" width="700" height="420"></canvas>
  <div id="bottomUI">
    <div id="qbar">
      <div class="qlbl">📋 Quest</div>
      <div id="qtext">—</div>
      <div id="qprog"></div>
    </div>
    <div id="scoreboard"></div>
    <div id="ctrl">
      <div class="chint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>E</kbd> talk to NPC · Walk over items to collect</div>
      <div id="dpad">
        <div></div><button class="db" ontouchstart="sm('up')" ontouchend="em('up')">▲</button><div></div>
        <button class="db" ontouchstart="sm('left')" ontouchend="em('left')">◄</button><div class="db"></div>
        <button class="db" ontouchstart="sm('right')" ontouchend="em('right')">►</button>
        <div></div><button class="db" ontouchstart="sm('down')" ontouchend="em('down')">▼</button><div></div>
      </div>
    </div>
    <div id="chatW">
      <input type="text" id="chatI" placeholder="Chat with friends..." maxlength="40">
      <button id="chatB" onclick="sendChat()">Send</button>
    </div>
  </div>
</div>

<div class="mo hide" id="mapMo">
  <div class="mb">
    <h2>🗺 Choose Map</h2>
    <div class="mgrd" id="mapGrd"></div>
    <button class="btn btn-red" onclick="closeMaps()">Close</button>
  </div>
</div>

<div class="mo hide" id="npcMo">
  <div class="mb">
    <h2 id="npcName">NPC</h2>
    <p id="npcText"></p>
    <div class="mbtns" id="npcBtns"></div>
  </div>
</div>

<div class="mo hide" id="mgMo">
  <div class="mb">
    <h2>🎮 Mini Games</h2>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn btn-green" style="font-size:10px;padding:8px;" onclick="startTTT()">Tic-Tac-Toe (2P)</button>
      <button class="btn" style="background:var(--purple);color:#fff;font-size:10px;padding:8px;" onclick="startRPS()">Rock Paper Scissors</button>
    </div>
    <div id="mgContent"></div>
    <button class="btn btn-red" style="margin-top:10px;font-size:11px;padding:8px;" onclick="closeMG()">Close</button>
  </div>
</div>

<div id="popup" class="hide"></div>

  const d=document.createElement('div');d.className='col-dot'+(c===selCol?' sel':'');d.style.background=c;
  d.onclick=()=>{selCol=c;document.querySelectorAll('.col-dot').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
  cr.appendChild(d);
});

function initItems(){
  Object.entries(MAPS).forEach(([mapId,m])=>{
    m.spawns.forEach((sp,i)=>{
      const id=`${mapId}_${i}`;
      allItems[id]={id,x:sp.x*T+T/2,y:sp.y*T+T/2,emoji:m.quest.emoji,mapId};
    });
  });
}

window.joinGame=function(){
  const name=document.getElementById('nameI').value.trim();
  const room=document.getElementById('roomI').value.trim().toLowerCase().replace(/\s+/g,'');
  if(!name){document.getElementById('errMsg').textContent='Enter your name';return;}
  if(!room){document.getElementById('errMsg').textContent='Enter room code';return;}
  document.getElementById('errMsg').textContent='Connecting...';
  try{
    const app=initializeApp(FB);
    db=getDatabase(app);
    roomId=room;
    myId='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    myPlayer={id:myId,name,avatar:selAv,color:selCol,x:200,y:200,dir:'down',moving:false,mapId:'forest'};
    initItems();
    startWorld();
  }catch(e){document.getElementById('errMsg').textContent='Error: '+e.message;}
};

function startWorld(){
  document.getElementById('joinScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  const pRef=ref(db,`rooms/${roomId}/players/${myId}`);
  set(pRef,myPlayer);
  onDisconnect(pRef).remove();

  onValue(ref(db,`rooms/${roomId}/players`),snap=>{
    players=snap.val()||{};
    document.getElementById('onl').textContent=`\u25cf ${Object.keys(players).length} online`;
    renderSB();
  });

  // Each player's picks stored separately: picks/itemId_playerId
  onValue(ref(db,`rooms/${roomId}/picks`),snap=>{pickedItems=snap.val()||{};});

  // Sync my stats from firebase
  onValue(ref(db,`rooms/${roomId}/stats/${myId}`),snap=>{
    const s=snap.val();
    if(s){myStats.coins=s.coins||0;myStats.level=s.level||1;myStats.xp=s.xp||0;myStats.questProg=s.questProg||{};myStats.questDone=s.questDone||{};updateHUD();updateQ();}
  });

  const chatRef=query(ref(db,`rooms/${roomId}/chat`),limitToLast(5));
  onValue(chatRef,snap=>{
    const msgs=snap.val()?Object.values(snap.val()):[];
    msgs.forEach(m=>{if(m.pid&&m.text)chatBubbles[m.pid]={text:m.text,time:Date.now()};});
  });

  onValue(ref(db,`rooms/${roomId}/ttt`),snap=>{
    const g=snap.val();
    if(g&&!document.getElementById('mgMo').classList.contains('hide'))renderTTT(g);
  });

  updateHUD();updateQ();
  requestAnimationFrame(loop);
}

function saveStats(){if(db)set(ref(db,`rooms/${roomId}/stats/${myId}`),{...myStats});}

function updateHUD(){
  document.getElementById('hcoin').textContent=`\u{1FA99} ${myStats.coins}`;
  document.getElementById('hlvl').textContent=`\u2b50 Lv.${myStats.level}`;
  document.getElementById('hmap').textContent=MAPS[curMap].name;
}
function updateQ(){
  const q=MAPS[curMap].quest;
  const prog=myStats.questProg[curMap]||0;
  const done=myStats.questDone[curMap];
  document.getElementById('qtext').textContent=done?`\u2705 ${q.label} \u2014 Done!`:`${q.label}`;
  document.getElementById('qprog').textContent=done?`+\u{1FA99}${q.reward} earned`:`${prog} / ${q.need}`;
}
function renderSB(){
  const sb=document.getElementById('scoreboard');sb.innerHTML='';
  Object.values(players).forEach(p=>{
    const d=document.createElement('div');d.className='sbi';
    d.innerHTML=`${p.avatar} <span>${p.name}</span>`;sb.appendChild(d);
  });
}

window.openMaps=function(){
  modalOpen=true;
  const g=document.getElementById('mapGrd');g.innerHTML='';
  Object.entries(MAPS).forEach(([id,m])=>{
    const lk=myStats.level<m.unlock,cur=id===curMap;
    const d=document.createElement('div');
    d.className='mc'+(lk?' lk':'')+(cur?' cur':'');
    d.innerHTML=`<div class="mi">${m.name.split(' ')[0]}</div><div class="mn">${m.name.split(' ').slice(1).join(' ')}</div><div class="mr">${lk?`\u{1F512} Lv.${m.unlock} required`:'\u2705 Available'}</div>`;
    if(!lk)d.onclick=()=>{changeMap(id);closeMaps();};
    g.appendChild(d);
  });
  document.getElementById('mapMo').classList.remove('hide');
};
window.closeMaps=function(){modalOpen=false;document.getElementById('mapMo').classList.add('hide');};

function changeMap(id){
  curMap=id;myPlayer.mapId=id;
  myPlayer.x=100+Math.random()*200;myPlayer.y=100+Math.random()*150;
  if(db)set(ref(db,`rooms/${roomId}/players/${myId}`),{...myPlayer});
  updateHUD();updateQ();
}

function checkNPC(){
  nearNpc=null;
  (MAPS[curMap].npcDefs||[]).forEach(n=>{
    const dx=myPlayer.x-n.x,dy=myPlayer.y-n.y;
    if(Math.sqrt(dx*dx+dy*dy)<45)nearNpc=n;
  });
}
function openNPC(n){
  modalOpen=true;
  document.getElementById('npcName').textContent=`${n.emoji} ${n.name}`;
  document.getElementById('npcText').textContent=n.dialog;
  const btns=document.getElementById('npcBtns');btns.innerHTML='';
  const cb=document.createElement('button');cb.className='btn btn-red';cb.style.cssText='font-size:11px;padding:9px;';
  cb.textContent='Goodbye';cb.onclick=closeNPC;btns.appendChild(cb);
  document.getElementById('npcMo').classList.remove('hide');
}
function closeNPC(){modalOpen=false;document.getElementById('npcMo').classList.add('hide');}

// ITEM SYSTEM — each player picks their own copy, respawn after 60s
function isPickedByMe(itemId){
  const key=`${itemId}_${myId}`;
  const pick=pickedItems[key];
  if(!pick)return false;
  if(Date.now()-pick.ts>60000){remove(ref(db,`rooms/${roomId}/picks/${key}`));return false;}
  return true;
}

function checkPickup(){
  Object.values(allItems).forEach(item=>{
    if(item.mapId!==curMap||isPickedByMe(item.id))return;
    const dx=myPlayer.x-item.x,dy=myPlayer.y-item.y;
    if(Math.sqrt(dx*dx+dy*dy)<22)collectItem(item);
  });
}

function collectItem(item){
  set(ref(db,`rooms/${roomId}/picks/${item.id}_${myId}`),{ts:Date.now(),pid:myId});
  myStats.coins+=10;myStats.xp+=15;checkLevel();
  const q=MAPS[curMap].quest;
  if(!myStats.questDone[curMap]){
    myStats.questProg[curMap]=(myStats.questProg[curMap]||0)+1;
    if(myStats.questProg[curMap]>=q.need){
      myStats.questDone[curMap]=true;myStats.coins+=q.reward;myStats.xp+=q.reward;checkLevel();
      showPop(`\u{1F389} Quest done! +\u{1FA99}${q.reward}`);
    }else{showPop(`${item.emoji} +10 coins (${myStats.questProg[curMap]}/${q.need})`);}
  }else{showPop(`${item.emoji} +10 coins`);}
  saveStats();updateHUD();updateQ();
}

function checkLevel(){
  const need=myStats.level*80;
  if(myStats.xp>=need){myStats.level++;myStats.xp-=need;showPop(`\u2b50 Level Up! Lv.${myStats.level}`);}
}

function showPop(msg){
  const el=document.getElementById('popup');el.textContent=msg;el.classList.remove('hide');
  if(popTimer)clearTimeout(popTimer);
  popTimer=setTimeout(()=>el.classList.add('hide'),2200);
}

// MINI GAMES
window.openMG=function(){modalOpen=true;document.getElementById('mgMo').classList.remove('hide');document.getElementById('mgContent').innerHTML='';};
window.closeMG=function(){modalOpen=false;document.getElementById('mgMo').classList.add('hide');};

window.startTTT=function(){set(ref(db,`rooms/${roomId}/ttt`),{board:Array(9).fill(''),turn:'X',result:''});};
function renderTTT(g){
  const el=document.getElementById('mgContent');
  const pList=Object.keys(players);
  const myMark=pList.indexOf(myId)%2===0?'X':'O';
  el.innerHTML=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">You: <b style="color:${myMark==='X'?'var(--accent)':'var(--blue)'}">${myMark==='X'?'\u2715':'\u25cb'}</b> \u00b7 Turn: <b style="color:var(--yellow)">${g.turn==='X'?'\u2715':'\u25cb'}</b></div>`;
  const grd=document.createElement('div');grd.id='tttgrd';
  g.board.forEach((c,i)=>{
    const d=document.createElement('div');d.className='tcel'+(c?' '+c.toLowerCase():'');
    d.textContent=c==='X'?'\u2715':c==='O'?'\u25cb':'';
    if(!c&&!g.result&&g.turn===myMark){
      d.onclick=()=>{
        const nb=[...g.board];nb[i]=myMark;
        const res=chkTTT(nb);
        set(ref(db,`rooms/${roomId}/ttt`),{board:nb,turn:g.turn==='X'?'O':'X',result:res});
        if(res&&res!=='draw'){myStats.coins+=30;saveStats();updateHUD();showPop('\u{1F3C6} +30 coins!');}
      };
    }
    grd.appendChild(d);
  });
  el.appendChild(grd);
  if(g.result){
    const r=document.createElement('div');r.style.cssText='font-size:13px;color:var(--yellow);text-align:center;margin-top:8px;letter-spacing:2px;';
    r.textContent=g.result==='draw'?'\u{1F91D} Draw!':`\u{1F3C6} ${g.result==='X'?'\u2715':'\u25cb'} Wins!`;el.appendChild(r);
    const rb=document.createElement('button');rb.className='btn btn-green';rb.style.cssText='font-size:10px;padding:7px;margin-top:8px;';
    rb.textContent='Play Again';rb.onclick=window.startTTT;el.appendChild(rb);
  }
}
function chkTTT(b){
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const[a,c,d]of L)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
  if(b.every(c=>c))return'draw';return'';
}

window.startRPS=function(){
  document.getElementById('mgContent').innerHTML=`
  <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Pick your move vs AI!</div>
  <div style="display:flex;gap:10px;justify-content:center;">
    <button onclick="playRPS('rock')" style="font-size:1.8rem;background:var(--bg);border:2px solid #3a3a5a;border-radius:10px;padding:12px 16px;cursor:pointer;">\u{1FAA8}</button>
    <button onclick="playRPS('paper')" style="font-size:1.8rem;background:var(--bg);border:2px solid #3a3a5a;border-radius:10px;padding:12px 16px;cursor:pointer;">\u{1F4C4}</button>
    <button onclick="playRPS('scissors')" style="font-size:1.8rem;background:var(--bg);border:2px solid #3a3a5a;border-radius:10px;padding:12px 16px;cursor:pointer;">\u2702</button>
  </div>
  <div id="rpsR" style="margin-top:12px;font-size:12px;color:var(--yellow);text-align:center;min-height:20px;letter-spacing:1px;"></div>`;
};
window.playRPS=function(c){
  const ch=['rock','paper','scissors'],em={rock:'\u{1FAA8}',paper:'\u{1F4C4}',scissors:'\u2702'};
  const ai=ch[Math.floor(Math.random()*3)];
  const wins={rock:'scissors',paper:'rock',scissors:'paper'};
  let res='';
  if(c===ai)res='\u{1F91D} Draw!';
  else if(wins[c]===ai){res='\u{1F3C6} You Win! +20 coins';myStats.coins+=20;saveStats();updateHUD();}
  else res='\u{1F480} You Lose!';
  document.getElementById('rpsR').textContent=`${em[c]} vs ${em[ai]} \u2014 ${res}`;
};

window.sendChat=function(){
  const inp=document.getElementById('chatI'),text=inp.value.trim();
  if(!text||!db)return;
  push(ref(db,`rooms/${roomId}/chat`),{pid:myId,name:myPlayer.name,text,ts:Date.now()});
  inp.value='';
};
document.getElementById('chatI').addEventListener('keydown',e=>{if(e.key==='Enter')window.sendChat();});
window.leaveGame=function(){if(db&&myId&&roomId)remove(ref(db,`rooms/${roomId}/players/${myId}`));location.reload();};

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if((e.key==='e'||e.key==='E')&&nearNpc&&!modalOpen)openNPC(nearNpc);
});
document.addEventListener('keyup',e=>keys[e.key]=false);
window.sm=d=>mkeys[d]=true;
window.em=d=>mkeys[d]=false;

function solid(x,y){
  const m=MAPS[curMap],tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(tx<0||ty<0||tx>=m.data[0].length||ty>=m.data.length)return true;
  const t=m.data[ty][tx];return t===1||t===2;
}

function movePlayer(){
  if(modalOpen)return;
  let dx=0,dy=0;
  if(keys['ArrowUp']||keys['w']||keys['W']||mkeys['up'])dy=-SPD;
  if(keys['ArrowDown']||keys['s']||keys['S']||mkeys['down'])dy=SPD;
  if(keys['ArrowLeft']||keys['a']||keys['A']||mkeys['left'])dx=-SPD;
  if(keys['ArrowRight']||keys['d']||keys['D']||mkeys['right'])dx=SPD;
  if(dx||dy){
    const nx=Math.max(16,Math.min(W-16,myPlayer.x+dx));
    const ny=Math.max(16,Math.min(H-16,myPlayer.y+dy));
    if(!solid(nx,myPlayer.y))myPlayer.x=nx;
    if(!solid(myPlayer.x,ny))myPlayer.y=ny;
    if(dy<0)myPlayer.dir='up';else if(dy>0)myPlayer.dir='down';
    else if(dx<0)myPlayer.dir='left';else myPlayer.dir='right';
    if(!myPlayer.moving)myPlayer.moving=true;
    if(db)set(ref(db,`rooms/${roomId}/players/${myId}`),{...myPlayer});
    checkPickup();checkNPC();
  }else if(myPlayer.moving){
    myPlayer.moving=false;
    if(db)set(ref(db,`rooms/${roomId}/players/${myId}`),{...myPlayer});
  }
}

const canvas=document.getElementById('worldCanvas');
const ctx=canvas.getContext('2d');
const TC={0:'#2d5a27',1:'#1e4a8c',2:'#1a3d15',3:'#8a7560',4:'#2d5a27',5:'#c8a96a',6:'#aaccee',8:'#2a2a3a'};

function drawTile(t,x,y){
  ctx.fillStyle=TC[t]||'#2d5a27';ctx.fillRect(x,y,T,T);
  if(t===0){ctx.fillStyle='#3a6e33';ctx.fillRect(x+4,y+8,3,2);ctx.fillRect(x+14,y+18,3,2);ctx.fillRect(x+22,y+6,3,2);}
  else if(t===2){ctx.fillStyle='#4a2800';ctx.fillRect(x+12,y+20,8,12);ctx.fillStyle='#2a7a1a';ctx.beginPath();ctx.arc(x+16,y+14,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38a022';ctx.beginPath();ctx.arc(x+12,y+10,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+20,y+10,10,0,Math.PI*2);ctx.fill();}
  else if(t===1){ctx.fillStyle='rgba(100,160,255,0.3)';ctx.fillRect(x+2,y+8+Math.sin(Date.now()/600+x)*2,T-4,4);ctx.fillRect(x+2,y+20+Math.sin(Date.now()/600+x+1)*2,T-4,4);}
  else if(t===3){ctx.fillStyle='#7a6550';ctx.fillRect(x+3,y+3,10,8);ctx.fillRect(x+18,y+10,10,8);ctx.fillRect(x+6,y+20,8,8);}
  else if(t===4){
    if(curMap==='forest'||curMap==='dungeon'){ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.arc(x+10,y+14,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(x+10,y+14,2,0,Math.PI*2);ctx.fill();}
    else if(curMap==='beach'){ctx.font='14px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('\u{1F334}',x+16,y+20);}
    else{ctx.fillStyle='rgba(180,220,255,0.6)';ctx.beginPath();ctx.arc(x+16,y+16,6,0,Math.PI*2);ctx.fill();}
  }
  else if(t===5){ctx.fillStyle='rgba(200,160,80,0.2)';ctx.fillRect(x+2,y+2,12,10);ctx.fillRect(x+18,y+18,10,8);}
  else if(t===8){if((Math.floor(x/T)+Math.floor(y/T))%2===0){ctx.fillStyle='rgba(60,60,90,0.3)';ctx.fillRect(x,y,T,T);}}
}

function drawMap(){
  const rows=MAPS[curMap].data;
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[0].length;c++)drawTile(rows[r][c],c*T,r*T);
}

function drawItems(){
  Object.values(allItems).forEach(item=>{
    if(item.mapId!==curMap||isPickedByMe(item.id))return;
    const p=Math.sin(Date.now()/400)*3;
    ctx.font=(18+p)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(item.emoji,item.x,item.y);
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath();ctx.arc(item.x,item.y,12+p,0,Math.PI*2);ctx.fill();
  });
}

function drawNPCs(){
  (MAPS[curMap].npcDefs||[]).forEach(n=>{
    const bob=Math.sin(Date.now()/500)*3;
    ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.emoji,n.x,n.y+bob);
    if(nearNpc===n){
      ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillStyle='rgba(255,212,96,0.9)';
      const tw=ctx.measureText('[E] Talk').width+10;
      ctx.beginPath();ctx.roundRect(n.x-tw/2,n.y-40+bob,tw,13,4);ctx.fill();
      ctx.fillStyle='#1a1a2e';ctx.fillText('[E] Talk',n.x,n.y-28+bob);
    }
    ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
    const nw=ctx.measureText(n.name).width+8;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(n.x-nw/2,n.y-24+bob,nw,13,3);ctx.fill();
    ctx.fillStyle='#ffd460';ctx.fillText(n.name,n.x,n.y-12+bob);
  });
}

function drawPlayer(p,isMe){
  if(!isMe&&(p.mapId||'forest')!==curMap)return;
  if(isMe&&p.mapId!==curMap)return;
  const x=p.x,y=p.y,bob=p.moving?Math.sin(Date.now()/120)*2:0;
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x,y+12,10,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=p.color||'#4ecca3';ctx.beginPath();ctx.arc(x,y-4+bob,13,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=isMe?'#fff':'rgba(255,255,255,0.4)';ctx.lineWidth=isMe?2.5:1.5;ctx.stroke();
  ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.avatar||'\u{1F431}',x,y-4+bob);
  ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
  const nw=ctx.measureText(p.name).width+10;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(x-nw/2,y-28+bob,nw,13,4);ctx.fill();
  ctx.fillStyle=isMe?'#4ecca3':'#fff';ctx.fillText(p.name,x,y-16+bob);
  const bub=chatBubbles[p.id];
  if(bub&&Date.now()-bub.time<4000){
    ctx.font='9px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
    const bw=Math.min(ctx.measureText(bub.text).width+14,130);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.beginPath();ctx.roundRect(x-bw/2,y-56+bob,bw,18,5);ctx.fill();
    ctx.fillStyle='#1a1a2e';let txt=bub.text;if(ctx.measureText(txt).width>bw-14)txt=txt.slice(0,16)+'\u2026';
    ctx.fillText(txt,x,y-47+bob);
  }
}

function loop(ts){
  if(ts-lastTime>16){
    lastTime=ts;
    ctx.clearRect(0,0,W,H);
    drawMap();drawItems();drawNPCs();
    movePlayer();
    const all={...players,[myId]:myPlayer};
    Object.values(all).sort((a,b)=>a.y-b.y).forEach(p=>drawPlayer(p,p.id===myId));
  }
  requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
</script>
